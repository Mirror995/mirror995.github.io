<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Passage</title>

<style>
/* ===== 主题变量 ===== */
:root {
  color-scheme: light dark;
  --bg: #f5f5f5;
  --text: #222;
  --paper-bg: #fff;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
  --muted: #888;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121212;
    --text: #e8e8e8;
    --paper-bg: #1d1d1d;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    --muted: #b0b0b0;
  }
}

/* ===== 字体（可以替换成你自己的 woff2）===== */
    @font-face {
      font-family: "SourceHanSerifCN";
      src: url("SourceHanSerifCN-Medium.subset.woff2") format("woff2");
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
/* ===== 全局 ===== */
body {
  margin: 0;
  background: var(--bg);
  font-family: "SourceHanSerifCN", "Songti SC", serif;
  color: var(--text);
}

/* ===== 信纸容器 ===== */
.letter {
  max-width: 680px;
  margin: 40px auto;
  padding: 40px 28px;

  background: var(--paper-bg);
  border-radius: 12px;

  box-shadow: var(--shadow);

  line-height: 1.9;
  font-size: 17px;
}

/* 手机优化 */
@media (max-width: 600px) {
  .letter {
    margin: 0;
    border-radius: 0;
    padding: 24px 18px;
    font-size: 16px;
  }
}

/* ===== 标题 / 开头 ===== */
.header {
  margin-bottom: 32px;
}

.date {
  color: var(--muted);
  font-size: 14px;
  margin-top: 8px;
}

.greeting {
  font-size: 20px;
}

/* ===== 正文 ===== */
.letter p {
  margin: 18px 0;
  text-indent: 2em;
  text-align: justify;
  word-break: break-word;
}

/* ===== 结尾 ===== */
.closing {
  margin-top: 40px;
  text-align: right;
}

.signature {
  margin-top: 12px;
}

.hidden {
  display: none;
}

.unlock {
  max-width: 420px;
  margin: 80px auto 24px;
  padding: 28px 24px;
  background: var(--paper-bg);
  border-radius: 12px;
  box-shadow: var(--shadow);
}

.unlock h1 {
  margin: 0 0 12px;
  font-size: 22px;
}

.unlock p {
  margin: 0 0 14px;
  color: var(--muted);
  font-size: 15px;
}

.unlock-row {
  display: flex;
  gap: 10px;
}

.unlock input {
  flex: 1;
  min-width: 0;
  border: 1px solid color-mix(in oklab, var(--muted) 35%, transparent);
  border-radius: 8px;
  padding: 10px 12px;
  font: inherit;
  color: var(--text);
  background: color-mix(in oklab, var(--paper-bg) 88%, var(--bg));
}

.unlock button {
  border: 0;
  border-radius: 8px;
  padding: 10px 14px;
  font: inherit;
  cursor: pointer;
  color: #fff;
  background: #2e6cf6;
}

.unlock .error {
  min-height: 20px;
  margin-top: 10px;
  color: #d43f3f;
  font-size: 14px;
}

.actions {
  max-width: 680px;
  margin: 12px auto 36px;
  padding: 0 6px;
  text-align: right;
}

#saveTxtBtn {
  border: 1px solid color-mix(in oklab, var(--muted) 35%, transparent);
  border-radius: 8px;
  padding: 8px 12px;
  font: inherit;
  color: var(--text);
  background: var(--paper-bg);
  cursor: pointer;
}

.meta {
  margin-bottom: 28px;
  padding: 14px 16px;
  border-radius: 10px;
  background: color-mix(in oklab, var(--paper-bg) 84%, var(--bg));
}

.meta-item {
  margin: 0;
  line-height: 1.7;
  color: var(--muted);
}

.meta-item + .meta-item {
  margin-top: 6px;
}

.meta-item span {
  color: var(--text);
}

.seal {
  margin-top: 18px;
  text-align: right;
}

.seal img {
  width: 100px;
  height: 100px;
  display: inline-block;
  opacity: 0.95;
}
</style>
</head>

<body>

<div class="unlock" id="unlockPanel">
  <h1>已加密</h1>
  <p>请输入密码后查看内容。</p>
  <div class="unlock-row">
    <input id="passwordInput" type="password" placeholder="输入密码" autocomplete="current-password">
    <button id="unlockBtn" type="button">解锁</button>
  </div>
  <div class="error" id="errorMsg"></div>
</div>

<div class="letter hidden" id="letterContent"></div>

<div class="actions hidden" id="actionsBar">
  <button id="saveTxtBtn" type="button">保存为TXT</button>
</div>

function b64ToBytes(base64) {
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) {
    bytes[i] = binary.charCodeAt(i);
  }
  return bytes;
}

async function decryptLetter(password) {
  const enc = new TextEncoder();
  const passwordKey = await crypto.subtle.importKey(
    "raw",
    enc.encode(password),
    "PBKDF2",
    false,
    ["deriveKey"]
  );

  const salt = b64ToBytes(encryptedPayload.salt);
  const iv = b64ToBytes(encryptedPayload.iv);
  const tag = b64ToBytes(encryptedPayload.tag);
  const ciphertext = b64ToBytes(encryptedPayload.ciphertext);
  const data = new Uint8Array(ciphertext.length + tag.length);
  data.set(ciphertext, 0);
  data.set(tag, ciphertext.length);

  const aesKey = await crypto.subtle.deriveKey(
    {
      name: "PBKDF2",
      salt,
      iterations: encryptedPayload.iterations,
      hash: "SHA-256"
    },
    passwordKey,
    {
      name: "AES-GCM",
      length: 256
    },
    false,
    ["decrypt"]
  );

  const decrypted = await crypto.subtle.decrypt(
    {
      name: "AES-GCM",
      iv
    },
    aesKey,
    data
  );
  return new TextDecoder().decode(decrypted);
}

  const holder = document.createElement("div");
  holder.innerHTML = decryptedHtmlCache;

  const paragraphNodes = holder.querySelectorAll(".letter-body p");
  const body = Array.from(paragraphNodes)
    .map((node) => node.textContent.trim())
    .filter(Boolean)
    .join("\n\n");

  const signature = holder.querySelector(".signature")?.textContent?.trim() || "";
  const date = holder.querySelector(".date")?.textContent?.trim() || "";
  return [body, signature, date].filter(Boolean).join("\n");
}

function saveAsTxt() {
  const text = createExportText();
  if (!text) return;
  const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "Content.txt";
  link.click();
  URL.revokeObjectURL(url);
}

async function handleUnlock() {
  const password = passwordInput.value;
  errorMsg.textContent = "";

  if (!password) {
    errorMsg.textContent = "请输入密码。";
    return;
  }

  unlockBtn.disabled = true;
  unlockBtn.textContent = "…";
  try {
    const html = await decryptLetter(password);
    decryptedHtmlCache = html;
    letterContent.innerHTML = html;
    letterContent.classList.remove("hidden");
    actionsBar.classList.remove("hidden");
    unlockPanel.classList.add("hidden");
  } catch (error) {
    errorMsg.textContent = "密码错误或数据损坏。";
  } finally {
    unlockBtn.disabled = false;
    unlockBtn.textContent = "解锁";
  }
}

unlockBtn.addEventListener("click", handleUnlock);
passwordInput.addEventListener("keydown", (event) => {
  if (event.key === "Enter") {
    handleUnlock();
  }
});
saveTxtBtn.addEventListener("click", saveAsTxt);
</script>

</body>
</html>
