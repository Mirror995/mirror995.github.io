<script>
  (function () {
    const lightTheme = "light";
    const darkTheme = "dark";

    const resolveTheme = () => {
      const htmlTheme = document.documentElement.dataset.theme;
      if (htmlTheme === "dark") {
        return darkTheme;
      }
      if (htmlTheme === "light") {
        return lightTheme;
      }
      return window.matchMedia("(prefers-color-scheme: dark)").matches ? darkTheme : lightTheme;
    };

    const setGiscusTheme = (theme) => {
      const iframe = document.querySelector("iframe.giscus-frame");
      if (!iframe) {
        return;
      }
      iframe.contentWindow.postMessage(
        { giscus: { setConfig: { theme } } },
        "https://giscus.app"
      );
    };

    const loadGiscus = () => {
      const script = document.createElement("script");
      script.src = "https://giscus.app/client.js";
      script.setAttribute("data-repo", "Mirror995/blog_comments");
      script.setAttribute("data-repo-id", "R_kgDOQjTHcQ");
      script.setAttribute("data-category", "Announcements");
      script.setAttribute("data-category-id", "DIC_kwDOQjTHcc4Czcb-");
      script.setAttribute("data-mapping", "title");
      script.setAttribute("data-strict", "0");
      script.setAttribute("data-reactions-enabled", "1");
      script.setAttribute("data-emit-metadata", "0");
      script.setAttribute("data-input-position", "top");
      script.setAttribute("data-theme", resolveTheme());
      script.setAttribute("data-lang", "zh-CN");
      script.setAttribute("data-loading", "lazy");
      script.crossOrigin = "anonymous";
      script.async = true;
      document.getElementById("giscus").appendChild(script);
    };

    loadGiscus();

    const observer = new MutationObserver(() => {
      setGiscusTheme(resolveTheme());
    });
    observer.observe(document.documentElement, {
      attributes: true,
      attributeFilter: ["data-theme"],
    });
  })();
</script>
